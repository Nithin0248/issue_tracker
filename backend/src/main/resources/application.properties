spring.application.name=issue-tracker
server.port=${PORT:8080}

# ---- Database (PostgreSQL). Override with env vars; see README ----
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:issue_tracker}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ---- JPA / Hibernate ----
# "update" is fine for a portfolio project. For real production use Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=25

# ---- JWT ----
# Secret must be at least 32 characters. ALWAYS set JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS / WebSocket origins (comma separated, wildcards allowed e.g. https://*.vercel.app) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- File uploads (screenshots) ----
app.upload-dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Demo data (creates demo users/projects/tickets when the DB is empty) ----
# Off by default so a deployed instance never ships with known demo passwords.
# The "dev" profile and docker-compose turn it on.
app.seed.enabled=${SEED_DEMO_DATA:false}

# Cap page size so ?size=100000 can't dump a table
spring.data.web.pageable.max-page-size=200

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

management.endpoints.web.exposure.include=health
