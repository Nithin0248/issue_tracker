# Run everything locally:  docker compose up --build
#   Frontend  http://localhost:3000
#   API       http://localhost:8080   (Swagger: http://localhost:8080/swagger-ui.html)
# Demo logins are created on first start: admin@demo.com / Admin@123, manager@demo.com / Manager@123,
# dev@demo.com / Developer@123
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: issue_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d issue_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: issue_tracker
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: local-compose-secret-change-me-local-compose-secret
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SEED_DEMO_DATA: "true"
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
        VITE_SHOW_DEMO: "true"
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  uploads:
